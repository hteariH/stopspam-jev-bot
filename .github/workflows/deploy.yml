name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # node:sqlite (the test database) needs 22.13 or newer.
          node-version: "24"
          cache: npm

      # npm ci installs the pinned @tgcloud/cli. Never call `npx tgcloud`
      # without it: the unscoped npm package "tgcloud" is unrelated
      # third-party code that npx would fetch instead.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Telegram Serverless
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      # Until the token is set, the deploy reports itself skipped instead of failing.
      - name: Check secrets
        id: secrets
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Deploy skipped — missing secret: TGCLOUD_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      # Pushes code only. Database schema changes are never applied from CI:
      # `npx tgcloud migrate` is run by hand, after reading what it will do.
      # --force because CI is the source of truth for what is deployed.
      - name: Push modules
        if: steps.secrets.outputs.ready == 'true'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx --no-install tgcloud push --force

      - name: Check the webhook
        if: steps.secrets.outputs.ready == 'true'
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx --no-install tgcloud webhook
